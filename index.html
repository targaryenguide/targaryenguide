<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARGARYEN GUIDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="mobile-header">
        <button id="menu-toggle-btn" class="menu-trigger-btn">Chọn Ải</button>
        <h3 style="margin: 0; color: #FF5C83;">TARGARYEN GUIDE</h3>
    </header>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar">
            <h2 class="logo">TARGARYEN GUIDE</h2>

            <div class="sidebar-tabs">
                <button class="tab-btn active" data-tab="journey">Chặng Chính</button>
                <button class="tab-btn" data-tab="arena">Thi Đấu</button>
                <button class="tab-btn" data-tab="association">Chặng Hội</button>
            </div>

            <div id="chapter-list"></div>
        </aside>

        <main class="main-content">
            <div id="stage-info">
                <h2 id="stage-title" , style="color: #FF5C83;">Chào mừng đến với TARGARYEN GUIDE </h2>
                <p id="stage-attributes" class="tags">Chọn một ải ở thanh menu bên trái để xem gợi ý phối đồ nhé!</p>
            </div>
            <div id="changelog-board" class="notice-board">
                <div class="notice-header">
                    <span>SET ĐÃ HOÀN THIỆN</span>
                </div>
                <div class="notice-body">
                    <ul class="changelog-list">
                        <li><span class="badge-new">NEW</span> <b>Khu Thi Đấu:</b> chưa có </li>
                        <li><span class="badge-new">NEW</span> <b>Chặng Chính:</b> chưa có </li>
                        <li><span class="badge-new">NEW</span> <b>Chặng Hội:</b> chưa có </li>
                    </ul>
                </div>
            </div>
            <div id="stage-details-area"></div>
        </main>
    </div>

    <dialog id="item-modal">
        <h3 id="modal-title"></h3>
        <img id="modal-img" src="" alt="Hình ảnh vật phẩm">
        <div id="modal-details"></div>
        <button class="btn-close" onclick="document.getElementById('item-modal').close()">Đóng</button>
    </dialog>

    <script src="app.js"></script>
</body>

</html>
